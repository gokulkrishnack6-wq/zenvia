    <!-- Top Bar of Z -->
    <path d="M 126 27 C 129 25, 137 25, 148 26 C 151 24, 154 21, 156 18 C 158 21, 156 25, 152 27.5 M 148 26 C 142 27, 132 27.5, 128 30 Z" />
    <!-- Leaf at Top Right -->
