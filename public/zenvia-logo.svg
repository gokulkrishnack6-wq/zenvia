<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" fill="none" aria-label="Zenvia Official Logo">
  <defs>
    <linearGradient id="zenviaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0A2" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
  </defs>

  <!-- Outer Emblem Circle -->
  <circle cx="140" cy="38" r="24" stroke="url(#zenviaGold)" stroke-width="2.2" fill="none" />

