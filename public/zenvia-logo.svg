    <path d="M 151 24 Q 155 21.5 158 19" stroke="#111" stroke-width="0.8" fill="none" />
    <!-- Diagonal Body of Z -->
    <path d="M 148 26.5 L 129 48 C 134 48, 146 47.5, 152 48 C 154 48.5, 152 50.5, 147 50.5 L 126 50.5 C 124 50.5, 123 49.2, 124.5 48 C 127 45, 143 28, 148 26.5 Z" />
  </g>

  <!-- Brand Name Typography: ZENVIA -->
  <text x="140" y="86" text-anchor="middle" fill="url(#zenviaGold)" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', serif" font-size="22" font-weight="700" letter-spacing="0.32em">ZENVIA</text>
</svg>
